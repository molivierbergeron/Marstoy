name: Construire le catalogue et publier le site

# Le runner GitHub a un accès Internet complet : c'est lui qui va chercher le
# catalogue Marstoy et les exports Rebrickable, résout les références, puis
# publie le site statique sur GitHub Pages.

on:
  workflow_dispatch:
  schedule:
    # Rafraîchit le catalogue une fois par semaine.
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'scripts/**'
      - 'lib/setnum.js'
      - 'site/**'
      - 'overrides.json'
      - '.github/workflows/build-catalog.yml'
      # Évite de se redéclencher sur ses propres commits de données.
      - '!site/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      resolved: ${{ steps.summary.outputs.resolved }}
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Diagnostic : GitHub n'avertit jamais qu'un secret est mal nommé, le
      # workflow reçoit simplement une valeur vide. On le dit explicitement,
      # sans rien révéler de la valeur.
      - name: Vérifier la configuration
        env:
          BRICKSET_SECRET: ${{ secrets.BRICKSET_API_KEY }}
          BRICKSET_VAR: ${{ vars.BRICKSET_API_KEY }}
          FAVORIS_VAR: ${{ vars.FAVORIS_API_URL }}
          FAVORIS_SECRET: ${{ secrets.FAVORIS_API_URL }}
        run: |
          # Écrit dans le résumé du run et dans les logs : le résumé n'est
          # lisible que depuis l'interface, les logs le sont par l'API.
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          say '## Configuration'
          if [ -n "$BRICKSET_SECRET" ]; then
            say "- \`BRICKSET_API_KEY\` : trouvée dans les **secrets** (${#BRICKSET_SECRET} caractères)"
          elif [ -n "$BRICKSET_VAR" ]; then
            say "- \`BRICKSET_API_KEY\` : trouvée dans les **variables** (${#BRICKSET_VAR} caractères)"
          else
            say '- `BRICKSET_API_KEY` : **introuvable** — la ligne « xx $ off » restera masquée.'
            say '  - Settings → Secrets and variables → **Actions** → onglet **Secrets** → *New repository secret*'
            say '  - Le nom doit être exactement `BRICKSET_API_KEY` (sensible à la casse)'
            say '  - Un secret d'"'"'*environnement* ou d'"'"'*organisation* n'"'"'est pas visible ici : il faut un secret de **dépôt**'
          fi

          if [ -n "$FAVORIS_VAR" ]; then
            say "- \`FAVORIS_API_URL\` : trouvée dans les **variables** → $FAVORIS_VAR"
          elif [ -n "$FAVORIS_SECRET" ]; then
            say '- `FAVORIS_API_URL` : trouvée dans les **secrets**. Ça marche, mais sa place est dans les *variables* — cette adresse est publique.'
          else
            say '- `FAVORIS_API_URL` : **introuvable** — les favoris resteront sur chaque appareil, sans synchronisation.'
            say '  - Settings → Secrets and variables → **Actions** → onglet **Variables** → *New repository variable*'
            say '  - Nom exact `FAVORIS_API_URL`, valeur = adresse du Worker'
          fi

      # Le Worker des favoris vit chez Cloudflare : ce runner est le seul endroit
      # d'où on puisse constater qu'il répond vraiment.
      # Pas de `if:` ici : le contexte `secrets` y est interdit, et un `if`
      # invalide empêche le workflow entier de démarrer. On teste dans le script.
      - name: Vérifier le Worker des favoris
        env:
          FAVORIS_API_URL: ${{ vars.FAVORIS_API_URL || secrets.FAVORIS_API_URL }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "${FAVORIS_API_URL:-}" ]; then
            say '- Worker des favoris : **adresse inconnue**, vérification impossible.'
            exit 0
          fi
          base="${FAVORIS_API_URL%/}"
          code=$(curl -s -o /tmp/users.json -w '%{http_code}' --max-time 20 "$base/api/users" || echo 000)

          if [ "$code" = "200" ]; then
            noms=$(node -e "
              const d = require('/tmp/users.json');
              console.log((d.users || []).map((u) => u.name + ' (' + u.count + ')').join(', ') || 'aucun compte');
            ")
            say "- Worker des favoris : **en ligne** — comptes : $noms"
          else
            say "- Worker des favoris : **HTTP $code** sur \`$base/api/users\`"
            say '  - `000` : adresse injoignable, Worker non déployé ou mal orthographiée'
            say '  - `500` : le branchement KV `FAVORIS` manque sur le Worker'
            head -c 300 /tmp/users.json 2>/dev/null | sed 's/^/    /' || true
          fi

      - name: Construire le catalogue
        id: build
        # Le repli API n'est utilisé que pour les références absentes du dump
        # public ; le secret est optionnel.
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          # Prix de détail LEGO (« xx $ off »). Accepte le secret ou, à défaut,
          # une variable de dépôt du même nom — les deux se confondent aisément
          # dans l'interface GitHub. Sans l'un ni l'autre, la ligne d'écart ne
          # s'affiche simplement pas.
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY || vars.BRICKSET_API_KEY }}
          # Adresse publique du Worker des favoris (variable, pas secret).
          FAVORIS_API_URL: ${{ vars.FAVORIS_API_URL || secrets.FAVORIS_API_URL }}
        run: node scripts/build-catalog.mjs
        continue-on-error: true

      - name: Résumé de la reconnaissance
        id: summary
        if: always()
        run: |
          if [ -f data/recon.json ]; then
            echo "## Reconnaissance marstoy.com" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const r = require('./data/recon.json');
              console.log(JSON.stringify({
                strategyUsed: r.strategyUsed,
                counts: r.counts,
                attempts: r.attempts.slice(0, 30),
                sampleKeys: Object.keys(r.samples || {}),
                unresolvedSample: (r.unresolved || []).slice(0, 15),
              }, null, 2));
            " | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Aucun data/recon.json produit.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f site/data/catalog.json ]; then
            node -e "
              const c = require('./site/data/catalog.json');
              console.log('resolved=' + c.counts.resolved);
              console.log(JSON.stringify(c.products.slice(0, 8), null, 2));
            " | tee /tmp/head.txt
            echo "resolved=$(node -p "require('./site/data/catalog.json').counts.resolved")" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commiter le catalogue et le rapport
        if: always()
        run: |
          set -u
          FILES='data/recon.json site/data/catalog.json data/lego-prices.json data/first-seen.json'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Ces fichiers sont entièrement dérivés du run : en cas de course avec
          # un autre push, on se recale sur la branche distante et on les repose
          # dessus, plutôt que de tenter une fusion qui n'a aucun sens ici.
          mkdir -p /tmp/generated
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/generated/ || true; done

          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            for f in $FILES; do
              base=$(basename "$f")
              [ -f "/tmp/generated/$base" ] && { mkdir -p "$(dirname "$f")"; cp "/tmp/generated/$base" "$f"; }
            done

            git add -f $FILES 2>/dev/null || true
            if git diff --cached --quiet; then
              echo 'Rien à commiter.'
              break
            fi

            # [skip ci] : ce commit ne doit pas relancer le workflow.
            git commit -m "Rafraîchit le catalogue Marstoy [skip ci]"
            if git push; then
              echo "Poussé (tentative $attempt)."
              break
            fi
            echo "Push refusé — la branche a bougé, nouvelle tentative."
            sleep $((attempt * 3))
          done

      - name: Échouer si le catalogue est vide
        if: steps.summary.outputs.resolved == '0'
        run: |
          echo "::error::Aucun produit résolu — voir data/recon.json dans le dépôt."
          exit 1

      # Tant que Pages n'est pas activé (Settings → Pages → Source : GitHub
      # Actions), cette étape échoue. Le catalogue est déjà commité à ce
      # stade, donc on ne fait pas échouer le run pour ça : on le signale.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Rappeler d'activer Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages n'est pas activé. Settings → Pages → Source : GitHub Actions, puis relancer ce workflow."
          {
            echo '## ⚠ Site non publié'
            echo 'GitHub Pages n'"'"'est pas activé pour ce dépôt.'
            echo '1. **Settings → Pages → Build and deployment → Source : `GitHub Actions`**'
            echo '2. Relancer ce workflow.'
            echo ''
            echo 'Le catalogue a bien été construit et commité (`site/data/catalog.json`).'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
