<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marstoy réel — vrais sets LEGO</title>
<meta name="description" content="Le catalogue Marstoy avec les vrais noms et visuels des sets LEGO.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marstoy réel">
<meta name="theme-color" content="#0b1220">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e6ea;
    --text: #14181f;
    --muted: #5f6875;
    --accent: #1d5fd6;
    --chip: #eef1f5;
    --save-bg: #e7f6ec;
    --save-fg: #15703c;
    --star: #e8a400;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --surface: #151c2b; --border: #263148; --text: #e8ecf4;
      --muted: #98a3b6; --accent: #74a8ff; --chip: #1e2739;
      --save-bg: #16351f; --save-fg: #6ee79a; --star: #ffc542;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --surface: #fff; --border: #e3e6ea; --text: #14181f;
    --muted: #5f6875; --accent: #1d5fd6; --chip: #eef1f5;
    --save-bg: #e7f6ec; --save-fg: #15703c; --star: #e8a400;
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --surface: #151c2b; --border: #263148; --text: #e8ecf4;
    --muted: #98a3b6; --accent: #74a8ff; --chip: #1e2739;
    --save-bg: #16351f; --save-fg: #6ee79a; --star: #ffc542;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .brand img { width: 28px; height: 28px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }

  button { font: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #account {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    max-width: 48%; overflow: hidden;
    font-size: 12px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 11px;
  }
  #account span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #refresh {
    flex: none; width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 16px; line-height: 1;
  }
  #refresh[disabled] { opacity: .5; }
  #refresh.spinning { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { display: flex; gap: 8px; }
  input[type="search"], select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    -webkit-appearance: none; appearance: none;
  }
  input[type="search"] { flex: 1; min-width: 0; }
  select { max-width: 44%; }

  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; padding: 7px 10px; border-radius: 9px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: transparent; }

  main { padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  .status { color: var(--muted); font-size: 13px; padding: 4px 0 12px; }

  .totals {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 12px;
  }
  .totals b { font-size: 17px; }
  .totals .sub { font-size: 12px; color: var(--muted); }
  .totals .save { font-size: 12px; }
  .totals button {
    margin-left: auto; font-size: 12px; font-weight: 600; padding: 7px 11px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--chip); color: var(--text);
  }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    position: relative; aspect-ratio: 4 / 3; background: var(--chip);
    display: flex; align-items: center; justify-content: center;
    /* Sans ça, le texte alternatif d'une image manquante étire la carte. */
    overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: contain;
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .thumb .fallback { font-size: 12px; color: var(--muted); padding: 8px; text-align: center; }
  .star {
    position: absolute; top: 6px; right: 6px; width: 32px; height: 32px;
    border-radius: 50%; border: 0; line-height: 1; font-size: 17px;
    background: rgba(255, 255, 255, .86); color: #98a3b6;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
  }
  .star[aria-pressed="true"] { color: var(--star); }
  .star[disabled] { opacity: 0; pointer-events: none; }

  .body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .facts { font-size: 12px; color: var(--muted); }
  .theme {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; flex-wrap: wrap; }
  /* Le prix Marstoy est l'information principale de cette ligne. */
  .price { font-size: 15px; font-weight: 700; color: var(--text); }
  .was { font-size: 12px; color: var(--muted); text-decoration-thickness: 1px; }
  .save {
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--save-bg); color: var(--save-fg);
    padding: 4px 6px; border-radius: 6px; white-space: nowrap;
  }
  .links { display: flex; gap: 10px; font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:active { opacity: .6; }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; font-size: 14px; }
  #sentinel { height: 1px; }

  /* Feuille des comptes */
  #sheet {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(11, 18, 32, .45);
    align-items: flex-end; justify-content: center;
  }
  #sheet[open] { display: flex; }
  #sheet .panel {
    background: var(--bg); width: 100%; max-width: 460px;
    border-radius: 16px 16px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 82vh; overflow-y: auto;
  }
  #sheet h2 { margin: 0 0 4px; font-size: 16px; }
  #sheet p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .user-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 13px; margin-bottom: 8px;
    font-size: 14px; color: var(--text); text-align: left;
  }
  .user-row .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .user-row.current { border-color: var(--accent); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .sheet-actions button {
    flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .sheet-actions .primary { background: var(--accent); color: #fff; border-color: transparent; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="./icon.svg" alt="">
    <h1>Marstoy réel</h1>
    <button id="account" type="button" title="Changer de compte">👤 <span>Invité</span></button>
    <button id="refresh" type="button" title="Reconstruire le catalogue">⟳</button>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Nom, n° LEGO, référence M…, thème" autocomplete="off"
           enterkeyhint="search" aria-label="Rechercher">
    <select id="sort" aria-label="Tri">
      <option value="added">Ajouts récents</option>
      <option value="savingsPct">Économie %</option>
      <option value="savingsAbs">Économie $</option>
      <option value="priceAsc">Prix ↑</option>
      <option value="legoDesc">Prix LEGO ↓</option>
      <option value="parts">Plus de pièces</option>
      <option value="year">Année du set</option>
      <option value="name">Nom A→Z</option>
    </select>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-all" role="tab" aria-selected="true" data-view="all">Tout le catalogue</button>
    <button class="tab" id="tab-list" role="tab" aria-selected="false" data-view="list">★ Ma liste</button>
  </div>
</header>

<main>
  <div class="totals" id="totals" hidden></div>
  <div class="status" id="status">Chargement du catalogue…</div>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>

<div id="sheet">
  <div class="panel">
    <h2>Compte</h2>
    <p id="sheet-hint"></p>
    <div id="sheet-users"></div>
    <div class="sheet-actions">
      <button type="button" id="sheet-new" class="primary">Nouveau compte</button>
      <button type="button" id="sheet-close">Fermer</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const PAGE = 60;
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const totalsEl = document.getElementById('totals');
  const queryEl = document.getElementById('q');
  const sortEl = document.getElementById('sort');
  const accountEl = document.getElementById('account');
  const sheetEl = document.getElementById('sheet');

  const STORE_ACCOUNT = 'mr:account';
  const STORE_FAV = (slug) => `mr:fav:${slug}`;

  let products = [];
  let byCode = new Map();
  let filtered = [];
  let rendered = 0;
  let coverage = '';
  let priceNote = '';
  let sourceCurrency = 'USD';
  let repo = null;
  let api = null;

  let account = null;      // { slug, name } — le compte connecté
  let browsing = null;     // { slug, name } — liste d'un autre, en lecture seule
  let favorites = new Set();
  let view = 'all';
  let syncError = false;

  // Arrondi au dollar : la précision au cent n'aide pas à décider, et c'est de
  // toute façon une conversion.
  const amountFormat = new Intl.NumberFormat('fr-CA', { maximumFractionDigits: 0 });
  const money = (value) => `${amountFormat.format(Math.round(value))} $`;

  const escapeHtml = (value) =>
    String(value ?? '').replace(/[&<>"']/g, (char) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

  const normalize = (value) =>
    String(value ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const readJson = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  };

  function haystack(item) {
    if (!item._h) {
      item._h = normalize([item.name, item.num, item.setNum, item.code, item.theme, item.year,
        item.marstoyTitle].join(' '));
    }
    return item._h;
  }

  // Les sets sans prix LEGO connu n'ont pas d'économie : ils passent à la fin
  // des tris par économie plutôt que de s'intercaler comme des zéros.
  const byDesc = (field) => (a, b) => {
    const left = a[field];
    const right = b[field];
    if (left == null && right == null) return a.name.localeCompare(b.name);
    if (left == null) return 1;
    if (right == null) return -1;
    return right - left || a.name.localeCompare(b.name);
  };
  const byAsc = (field) => (a, b) => {
    const left = a[field];
    const right = b[field];
    if (left == null && right == null) return a.name.localeCompare(b.name);
    if (left == null) return 1;
    if (right == null) return -1;
    return left - right || a.name.localeCompare(b.name);
  };

  const comparators = {
    // Arrivée chez Marstoy, pas année de sortie du set. L'année départage tant
    // que le registre des arrivées n'a pas d'historique.
    added: (a, b) =>
      String(b.addedAt || '').localeCompare(String(a.addedAt || '')) ||
      (b.year ?? 0) - (a.year ?? 0) ||
      a.name.localeCompare(b.name),
    year: (a, b) => (b.year ?? 0) - (a.year ?? 0) || a.name.localeCompare(b.name),
    savingsPct: byDesc('savingsPct'),
    savingsAbs: byDesc('savingsCad'),
    priceAsc: byAsc('priceCad'),
    legoDesc: byDesc('legoPriceCad'),
    parts: byDesc('numParts'),
    name: (a, b) => a.name.localeCompare(b.name),
  };

  /* ---------------------------------------------------------------- favoris */

  const activeList = () => browsing || account;
  const canEdit = () => Boolean(account) && !browsing;

  function loadLocalFavorites(slug) {
    favorites = new Set(readJson(STORE_FAV(slug), []));
  }

  function saveLocalFavorites() {
    const list = activeList();
    if (list) localStorage.setItem(STORE_FAV(list.slug), JSON.stringify([...favorites]));
  }

  let syncTimer;
  function scheduleSync() {
    if (!api || !canEdit()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      try {
        const response = await fetch(`${api}/api/list/${account.slug}`, {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ codes: [...favorites] }),
        });
        if (!response.ok) throw new Error(String(response.status));
        syncError = false;
      } catch {
        // La liste reste en local : on retentera au prochain changement ou au
        // prochain chargement.
        syncError = true;
      }
      renderStatus();
    }, 700);
  }

  async function pullList(slug) {
    if (!api) return null;
    try {
      const response = await fetch(`${api}/api/list/${slug}`, { cache: 'no-store' });
      if (!response.ok) return null;
      return await response.json();
    } catch {
      return null;
    }
  }

  function toggleFavorite(code) {
    if (!canEdit()) {
      openSheet(browsing ? 'Reviens à ton compte pour modifier ta liste.' : null);
      return;
    }
    if (favorites.has(code)) favorites.delete(code);
    else favorites.add(code);
    saveLocalFavorites();
    scheduleSync();

    for (const button of grid.querySelectorAll(`[data-star="${code}"]`)) {
      button.setAttribute('aria-pressed', String(favorites.has(code)));
      button.textContent = favorites.has(code) ? '★' : '☆';
    }
    renderAccount();
    if (view === 'list') apply();
    else renderStatus();
  }

  /* ---------------------------------------------------------------- comptes */

  function renderAccount() {
    const label = browsing
      ? `👁 ${browsing.name}`
      : account
        ? `👤 ${account.name}`
        : '👤 Invité';
    accountEl.innerHTML = `<span>${escapeHtml(label)}</span>`;
    const listTab = document.getElementById('tab-list');
    const owner = activeList();
    listTab.textContent = owner
      ? `★ ${browsing ? browsing.name : 'Ma liste'} (${favorites.size})`
      : '★ Ma liste';
  }

  async function setAccount(user, { asBrowsing = false } = {}) {
    if (asBrowsing) {
      browsing = user;
    } else {
      browsing = null;
      account = user;
      if (user) localStorage.setItem(STORE_ACCOUNT, JSON.stringify(user));
      else localStorage.removeItem(STORE_ACCOUNT);
    }

    const owner = activeList();
    if (!owner) {
      favorites = new Set();
    } else {
      loadLocalFavorites(owner.slug);
      const remote = await pullList(owner.slug);
      if (remote) {
        // On fusionne au lieu d'écraser : une étoile ajoutée hors ligne sur cet
        // appareil ne doit pas disparaître au premier chargement.
        const merged = asBrowsing ? remote.codes : [...new Set([...favorites, ...remote.codes])];
        favorites = new Set(merged);
        saveLocalFavorites();
        if (!asBrowsing && merged.length !== remote.codes.length) scheduleSync();
      }
    }
    renderAccount();
    apply();
  }

  async function fetchUsers() {
    if (!api) return [];
    try {
      const response = await fetch(`${api}/api/users`, { cache: 'no-store' });
      if (!response.ok) return [];
      return (await response.json()).users || [];
    } catch {
      return [];
    }
  }

  async function openSheet(hint) {
    const hintEl = document.getElementById('sheet-hint');
    const usersEl = document.getElementById('sheet-users');
    sheetEl.setAttribute('open', '');

    if (!api) {
      hintEl.textContent =
        "Le serveur des listes n'est pas configuré : tes favoris restent sur cet appareil.";
      usersEl.innerHTML = '';
      return;
    }

    hintEl.textContent = hint || 'Choisis ton compte. Il te suivra d’un appareil à l’autre.';
    usersEl.innerHTML = '<div class="user-row">Chargement…</div>';
    const users = await fetchUsers();

    usersEl.innerHTML = users.length
      ? users.map((user) => `
          <button type="button" class="user-row${account && account.slug === user.slug ? ' current' : ''}"
                  data-slug="${escapeHtml(user.slug)}" data-name="${escapeHtml(user.name)}">
            ${escapeHtml(user.name)}
            <span class="count">${user.count} favori${user.count > 1 ? 's' : ''}</span>
          </button>`).join('')
      : '<p>Aucun compte pour l’instant. Crées-en un.</p>';
  }

  const closeSheet = () => sheetEl.removeAttribute('open');

  sheetEl.addEventListener('click', async (event) => {
    if (event.target === sheetEl) return closeSheet();

    const row = event.target.closest('[data-slug]');
    if (!row) return;
    const user = { slug: row.dataset.slug, name: row.dataset.name };

    if (account && account.slug === user.slug) {
      closeSheet();
      return setAccount(user);
    }
    // La confirmation est tout ce qui empêche d'ajouter par mégarde dans la
    // liste de quelqu'un d'autre. Ce n'est pas une protection, c'est un garde-fou.
    const confirmed = window.confirm(
      `Te connecter comme ${user.name} ?\n\n` +
      `Tes ★ iront dans sa liste. Annule pour la consulter sans y toucher.`,
    );
    closeSheet();
    await setAccount(user, { asBrowsing: !confirmed });
  });

  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  accountEl.addEventListener('click', () => openSheet());

  document.getElementById('sheet-new').addEventListener('click', async () => {
    if (!api) return closeSheet();
    const name = window.prompt('Prénom pour ce compte :', '');
    if (!name || !name.trim()) return;
    try {
      const response = await fetch(`${api}/api/users`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: name.trim() }),
      });
      const data = await response.json();
      if (response.status === 409) {
        window.alert('Ce compte existe déjà — choisis-le dans la liste.');
        return openSheet();
      }
      if (!response.ok) throw new Error(data.error || String(response.status));
      closeSheet();
      await setAccount({ slug: data.slug, name: data.name });
    } catch (error) {
      window.alert(`Création impossible : ${error.message}`);
    }
  });

  /* ------------------------------------------------------------------ vues */

  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      view = tab.dataset.view;
      for (const other of document.querySelectorAll('.tab')) {
        other.setAttribute('aria-selected', String(other === tab));
      }
      apply();
    });
  }

  function renderTotals() {
    if (view !== 'list' || !filtered.length) {
      totalsEl.hidden = true;
      return;
    }
    const marstoy = filtered.reduce((sum, item) => sum + (item.priceCad || 0), 0);
    const lego = filtered.reduce((sum, item) => sum + (item.legoPriceCad || 0), 0);
    const saved = lego > 0 ? lego - marstoy : 0;

    totalsEl.hidden = false;
    totalsEl.innerHTML =
      `<div><b>${escapeHtml(money(marstoy))}</b>` +
      `<div class="sub">${filtered.length} set${filtered.length > 1 ? 's' : ''}` +
      `${lego > 0 ? ` · LEGO ${escapeHtml(money(lego))}` : ''}</div></div>` +
      (saved > 0 ? `<span class="save">${escapeHtml(money(saved))} off</span>` : '') +
      '<button type="button" id="export">Exporter</button>';

    document.getElementById('export').addEventListener('click', exportList);
  }

  async function exportList() {
    const owner = activeList();
    const lines = filtered.map((item) =>
      `• ${item.name} (${item.code}) — ${money(item.priceCad || 0)}` +
      `${item.legoPriceCad ? ` au lieu de ${money(item.legoPriceCad)}` : ''}` +
      `\n  ${item.marstoyUrl || ''}`);
    const total = filtered.reduce((sum, item) => sum + (item.priceCad || 0), 0);
    const text =
      `Short list Marstoy${owner ? ` — ${owner.name}` : ''}\n\n` +
      `${lines.join('\n')}\n\nTotal : ${money(total)} CAD`;

    try {
      if (navigator.share) await navigator.share({ title: 'Short list Marstoy', text });
      else {
        await navigator.clipboard.writeText(text);
        window.alert('Liste copiée dans le presse-papiers.');
      }
    } catch {
      // Partage annulé par l'utilisateur : rien à signaler.
    }
  }

  function renderStatus() {
    const owner = activeList();
    if (view === 'list') {
      statusEl.textContent = filtered.length
        ? (browsing ? `Liste de ${browsing.name} — lecture seule` : 'Ta short list')
          + (syncError ? ' · ⚠ non synchronisée' : '')
        : '';
      return;
    }
    const terms = normalize(queryEl.value).split(/\s+/).filter(Boolean);
    statusEl.textContent =
      `${filtered.length} set${filtered.length > 1 ? 's' : ''}` +
      (terms.length ? ` sur ${products.length}` : coverage) +
      priceNote +
      (owner && syncError ? ' · ⚠ favoris non synchronisés' : '');
  }

  function apply() {
    const terms = normalize(queryEl.value).split(/\s+/).filter(Boolean);
    let pool = view === 'list' ? products.filter((item) => favorites.has(item.code)) : products;
    if (terms.length) pool = pool.filter((item) => terms.every((term) => haystack(item).includes(term)));

    filtered = pool.slice().sort(comparators[sortEl.value] || comparators.added);
    grid.replaceChildren();
    rendered = 0;

    renderTotals();
    renderStatus();

    if (!filtered.length) {
      grid.innerHTML = view === 'list'
        ? `<div class="empty">${activeList()
            ? 'Aucun favori pour l’instant — touche l’étoile d’un set.'
            : 'Choisis un compte en haut à droite pour créer ta short list.'}</div>`
        : '<div class="empty">Aucun résultat.</div>';
      return;
    }
    renderMore();
  }

  function priceHtml(item) {
    if (item.priceCad == null) {
      return item.price != null
        ? `<span class="price">${escapeHtml(item.price)} ${escapeHtml(sourceCurrency)}</span>`
        : '';
    }
    const original = item.price != null ? `${item.price} ${sourceCurrency}` : '';
    const parts = [
      `<span class="price" title="Prix Marstoy : ${escapeHtml(original)} — converti">` +
        `${escapeHtml(money(item.priceCad))}</span>`,
    ];
    if (item.savingsCad > 0 && item.legoPriceCad) {
      parts.push(`<s class="was" title="Prix de détail LEGO">${escapeHtml(money(item.legoPriceCad))}</s>`);
      const pct = item.savingsPct != null ? `${item.savingsPct} %` : null;
      parts.push(`<span class="save">${[pct, money(item.savingsCad)].filter(Boolean).join(' · ')}</span>`);
    }
    return parts.join('');
  }

  function cardHtml(item) {
    // Le numéro de set reste cherchable, mais il n'a pas sa place sur la carte :
    // c'est le nom et l'image qui identifient le set.
    const facts = [
      item.year || null,
      item.numParts ? `${item.numParts} pièces` : null,
    ].filter(Boolean).join(' · ');
    const starred = favorites.has(item.code);

    return `
      <article class="card">
        <div class="thumb">
          ${item.imgUrl
            ? `<img src="${escapeHtml(item.imgUrl)}" alt="${escapeHtml(item.name)}" loading="lazy"
                    referrerpolicy="no-referrer">`
            : '<div class="fallback">pas d\'image</div>'}
          <button class="star" type="button" data-star="${escapeHtml(item.code)}"
                  aria-pressed="${starred}" aria-label="Ajouter à ma liste"
                  ${canEdit() ? '' : 'disabled'}>${starred ? '★' : '☆'}</button>
        </div>
        <div class="body">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="facts">${facts}</div>
          ${item.theme ? `<div class="theme">${escapeHtml(item.theme)}</div>` : ''}
          <div class="row">${priceHtml(item)}</div>
          <div class="links">
            ${item.marstoyUrl ? `<a href="${escapeHtml(item.marstoyUrl)}" target="_blank"
                                    rel="noopener">Commander</a>` : ''}
            <a href="https://www.lego.com/fr-ca/search?q=${escapeHtml(item.num)}"
               target="_blank" rel="noopener">LEGO</a>
          </div>
        </div>
      </article>`;
  }

  function renderMore() {
    const slice = filtered.slice(rendered, rendered + PAGE);
    if (!slice.length) return;
    const fragment = document.createElement('template');
    fragment.innerHTML = slice.map(cardHtml).join('');
    grid.append(fragment.content);
    rendered += slice.length;
  }

  new IntersectionObserver((entries) => {
    if (entries.some((entry) => entry.isIntersecting)) renderMore();
  }, { rootMargin: '600px' }).observe(document.getElementById('sentinel'));

  grid.addEventListener('click', (event) => {
    const star = event.target.closest('[data-star]');
    if (star) toggleFavorite(star.dataset.star);
  });

  let timer;
  queryEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(apply, 120);
  });
  sortEl.addEventListener('change', apply);

  /* ------------------------------------------------------- reconstruction */

  const refreshEl = document.getElementById('refresh');
  const TOKEN_KEY = 'mr:ghToken';

  function askToken() {
    const token = window.prompt(
      'Un jeton GitHub est nécessaire pour lancer la reconstruction.\n\n' +
      'github.com/settings/personal-access-tokens/new\n' +
      '  · Only select repositories → ce dépôt\n' +
      '  · Repository permissions → Actions : Read and write\n\n' +
      'Il reste sur cet appareil.', '');
    if (token && token.trim()) {
      localStorage.setItem(TOKEN_KEY, token.trim());
      return token.trim();
    }
    return null;
  }

  async function waitForNewCatalog(previousDate) {
    const deadline = Date.now() + 10 * 60 * 1000;
    while (Date.now() < deadline) {
      await new Promise((resolve) => setTimeout(resolve, 20000));
      try {
        const response = await fetch(`./data/catalog.json?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const fresh = await response.json();
          if (fresh.generatedAt && fresh.generatedAt !== previousDate) return true;
        }
      } catch {
        // Réseau instable : on retentera au prochain tour.
      }
    }
    return false;
  }

  refreshEl.addEventListener('click', async () => {
    if (!repo || !repo.slug || !repo.ref) {
      window.alert('Reconstruction indisponible : le catalogue ne contient pas les informations du dépôt.');
      return;
    }
    const minutes = repo.approxMinutes || 4;
    if (!window.confirm(
      `Reconstruire le catalogue ?\n\n` +
      `Cela relance la collecte complète sur marstoy.com et prend environ ${minutes} minutes. ` +
      `La page se rechargera toute seule une fois terminé.`)) return;

    let token = localStorage.getItem(TOKEN_KEY) || askToken();
    if (!token) return;

    refreshEl.disabled = true;
    refreshEl.classList.add('spinning');
    const previousDate = (await (await fetch('./data/catalog.json', { cache: 'no-store' })).json())
      .generatedAt;

    try {
      const response = await fetch(
        `https://api.github.com/repos/${repo.slug}/actions/workflows/${repo.workflow}/dispatches`,
        {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ ref: repo.ref }),
        });

      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem(TOKEN_KEY);
        throw new Error('jeton refusé — il a été oublié, réessaie pour en saisir un autre');
      }
      if (!response.ok) throw new Error(`GitHub a répondu ${response.status}`);

      statusEl.textContent = `Reconstruction lancée — environ ${minutes} minutes…`;
      if (await waitForNewCatalog(previousDate)) window.location.reload();
      else statusEl.textContent = 'Toujours en cours — recharge la page dans quelques minutes.';
    } catch (error) {
      window.alert(`Reconstruction impossible : ${error.message}`);
      apply();
    } finally {
      refreshEl.disabled = false;
      refreshEl.classList.remove('spinning');
    }
  });

  /* ------------------------------------------------------------ démarrage */

  fetch('./data/catalog.json', { cache: 'no-cache' })
    .then((response) => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(async (catalog) => {
      products = catalog.products || [];
      byCode = new Map(products.map((item) => [item.code, item]));
      repo = catalog.repo || null;
      // La barre oblique finale est facile à copier depuis le tableau de bord
      // Cloudflare : on la retire plutôt que de fabriquer des « //api/… ».
      api = ((catalog.api && catalog.api.favorites) || '').replace(/\/+$/, '') || null;

      const total = catalog.counts && catalog.counts.marstoyProducts;
      if (total && total > products.length) {
        coverage = ` clonant un set LEGO, sur ${total} produits Marstoy`;
      }

      const currency = catalog.currency || {};
      if (currency.source) sourceCurrency = currency.source;
      if (currency.cadRate) {
        // Les montants des cartes portent « $ » sans devise : elle est nommée
        // ici, une fois.
        priceNote =
          ` · montants en CAD, convertis du ${sourceCurrency}` +
          `${currency.assumed ? ' (supposé)' : ''} au taux du ${currency.cadRateDate || '—'}` +
          `, prix LEGO barré au détail`;
      }

      if (!products.length) {
        statusEl.textContent = 'Catalogue vide — lance le workflow depuis l’onglet Actions.';
        return;
      }

      const saved = readJson(STORE_ACCOUNT, null);
      if (saved && saved.slug) await setAccount(saved);
      else {
        renderAccount();
        apply();
      }
    })
    .catch((error) => {
      statusEl.textContent = `Catalogue introuvable (${error.message}).`;
    });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
