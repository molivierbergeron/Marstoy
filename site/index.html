<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marstoy réel — vrais sets LEGO</title>
<meta name="description" content="Le catalogue Marstoy avec les vrais noms et visuels des sets LEGO.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marstoy réel">
<meta name="theme-color" content="#0b1220">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e6ea;
    --text: #14181f;
    --muted: #5f6875;
    --accent: #1d5fd6;
    --chip: #eef1f5;
    --save-bg: #e7f6ec;
    --save-fg: #15703c;
    --star: #e8a400;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --surface: #151c2b; --border: #263148; --text: #e8ecf4;
      --muted: #98a3b6; --accent: #74a8ff; --chip: #1e2739;
      --save-bg: #16351f; --save-fg: #6ee79a; --star: #ffc542;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --surface: #fff; --border: #e3e6ea; --text: #14181f;
    --muted: #5f6875; --accent: #1d5fd6; --chip: #eef1f5;
    --save-bg: #e7f6ec; --save-fg: #15703c; --star: #e8a400;
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --surface: #151c2b; --border: #263148; --text: #e8ecf4;
    --muted: #98a3b6; --accent: #74a8ff; --chip: #1e2739;
    --save-bg: #16351f; --save-fg: #6ee79a; --star: #ffc542;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .brand img { width: 28px; height: 28px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }

  button { font: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #account {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    max-width: 48%; overflow: hidden;
    font-size: 12px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 11px;
  }
  #account span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #refresh {
    flex: none; width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 16px; line-height: 1;
  }
  #refresh[disabled] { opacity: .5; }
  #refresh.spinning { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { display: flex; gap: 8px; }
  input[type="search"], select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    -webkit-appearance: none; appearance: none;
  }
  input[type="search"] { flex: 1; min-width: 0; }
  select { max-width: 44%; }

  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; padding: 7px 10px; border-radius: 9px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: transparent; }

  main { padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  .status { color: var(--muted); font-size: 13px; padding: 4px 0 12px; }

  .totals {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 12px;
  }
  /* `display: flex` l'emporte sur le `display: none` que le navigateur applique
     à [hidden] : sans cette règle, la barre reste une boîte vide. */
  .totals[hidden] { display: none; }
  .totals b { font-size: 17px; }
  .totals .sub { font-size: 12px; color: var(--muted); }
  .totals .save { font-size: 12px; }
  .totals button {
    margin-left: auto; font-size: 12px; font-weight: 600; padding: 7px 11px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--chip); color: var(--text);
  }

  .copyfallback {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 12px;
  }
  .copyfallback p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .copyfallback textarea {
    width: 100%; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    /* Sans nowrap, les colonnes tabulées se replient et deviennent illisibles. */
    white-space: pre; overflow-x: auto; resize: vertical;
  }
  .copyfallback button {
    margin-top: 8px; font-size: 12px; font-weight: 600; padding: 7px 11px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--chip); color: var(--text);
  }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    position: relative; aspect-ratio: 4 / 3; background: var(--chip);
    display: flex; align-items: center; justify-content: center;
    /* Sans ça, le texte alternatif d'une image manquante étire la carte. */
    overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: contain;
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .thumb .fallback { font-size: 12px; color: var(--muted); padding: 8px; text-align: center; }
  .card.unavailable .thumb img { filter: grayscale(1); opacity: .5; }
  /* Pas de vignette : la carte est faite de texte, et la référence tient la
     place du nom du set — qui est justement ce qu'on n'a pas pu confirmer. */
  .card.skipped .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .card.skipped .facts { line-height: 1.45; }
  /* Le motif du rejet est une phrase, pas une étiquette : sans ce retour à la
     ligne, `nowrap` la fait dépasser et `.card { overflow: hidden }` la coupe. */
  .card.skipped .gone { white-space: normal; }
  /* Une colonne : ces cartes sont faites de texte, pas d'une vignette. */
  .grid.rows { grid-template-columns: 1fr; }
  .gone {
    align-self: flex-start;
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--chip); color: var(--muted);
    padding: 4px 7px; border-radius: 6px; white-space: nowrap;
  }
  .star {
    position: absolute; top: 6px; right: 6px; width: 32px; height: 32px;
    border-radius: 50%; border: 0; line-height: 1; font-size: 17px;
    background: rgba(255, 255, 255, .86); color: #98a3b6;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
  }
  .star[aria-pressed="true"] { color: var(--star); }
  .star[disabled] { opacity: 0; pointer-events: none; }

  .body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .facts { font-size: 12px; color: var(--muted); }
  .theme {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; flex-wrap: wrap; }
  /* Le prix Marstoy est l'information principale de cette ligne. */
  .price { font-size: 15px; font-weight: 700; color: var(--text); }
  .was { font-size: 12px; color: var(--muted); text-decoration-thickness: 1px; }
  .save {
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--save-bg); color: var(--save-fg);
    padding: 4px 6px; border-radius: 6px; white-space: nowrap;
  }
  .links { display: flex; gap: 10px; font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:active { opacity: .6; }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; font-size: 14px; }
  #sentinel { height: 1px; }

  /* Feuille des comptes */
  #sheet {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(11, 18, 32, .45);
    align-items: flex-end; justify-content: center;
  }
  #sheet[open] { display: flex; }
  #sheet .panel {
    background: var(--bg); width: 100%; max-width: 460px;
    border-radius: 16px 16px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 82vh; overflow-y: auto;
  }
  #sheet h2 { margin: 0 0 4px; font-size: 16px; }
  #sheet p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .user-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 13px; margin-bottom: 8px;
    font-size: 14px; color: var(--text); text-align: left;
  }
  .user-row .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .user-row.current { border-color: var(--accent); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .sheet-actions button {
    flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .sheet-actions .primary { background: var(--accent); color: #fff; border-color: transparent; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="./icon.svg" alt="">
    <h1>Marstoy réel</h1>
    <button id="account" type="button" title="Changer de compte">👤 <span>Invité</span></button>
    <button id="refresh" type="button" title="Reconstruire le catalogue">⟳</button>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Nom, n° LEGO, référence M…, thème" autocomplete="off"
           enterkeyhint="search" aria-label="Rechercher">
    <select id="sort" aria-label="Tri">
      <option value="added">Arrivées (bêta)</option>
      <option value="year">Plus récents</option>
      <option value="savingsPct">Économie %</option>
      <option value="savingsAbs">Économie $</option>
      <option value="priceAsc">Prix ↑</option>
      <option value="legoDesc">Prix LEGO ↓</option>
      <option value="parts">Plus de pièces</option>
      <option value="name">Nom A→Z</option>
    </select>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-all" role="tab" aria-selected="true" data-view="all">Tout le catalogue</button>
    <button class="tab" id="tab-list" role="tab" aria-selected="false" data-view="list">★ Ma liste</button>
  </div>
</header>

<main>
  <div class="totals" id="totals" hidden></div>
  <div class="copyfallback" id="copyfallback" hidden>
    <p>Le navigateur a refusé l’accès au presse-papiers. Sélectionne le tableau et copie-le à la main.</p>
    <textarea readonly rows="6" aria-label="Tableau à copier"></textarea>
    <button type="button" id="copyfallback-close">Fermer</button>
  </div>
  <div class="status" id="status">Chargement du catalogue…</div>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>

<div id="sheet">
  <div class="panel">
    <h2>Compte</h2>
    <p id="sheet-hint"></p>
    <div id="sheet-users"></div>
    <div class="sheet-actions">
      <button type="button" id="sheet-new" class="primary">Nouveau compte</button>
      <button type="button" id="sheet-close">Fermer</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const PAGE = 60;
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const totalsEl = document.getElementById('totals');
  const queryEl = document.getElementById('q');
  const sortEl = document.getElementById('sort');
  const accountEl = document.getElementById('account');
  const sheetEl = document.getElementById('sheet');
  const fallbackEl = document.getElementById('copyfallback');

  document.getElementById('copyfallback-close')
    .addEventListener('click', () => { fallbackEl.hidden = true; });

  const STORE_ACCOUNT = 'mr:account';
  const STORE_FAV = (slug) => `mr:fav:${slug}`;
  // Un seul cache, partagé entre comptes : la donnée d'un set ne dépend pas de
  // qui l'a mis en favori. Sert à afficher un favori encore après qu'il ait
  // disparu du catalogue (Marstoy ne garde pas d'historique).
  const STORE_FAV_SNAP = 'mr:favsnap';

  let products = [];
  let skipped = [];
  let byCode = new Map();
  let filtered = [];
  let rendered = 0;
  let coverage = '';
  let priceNote = '';
  let scanNote = '';
  let sourceCurrency = 'USD';
  let repo = null;
  let api = null;

  let account = null;      // { slug, name } — le compte connecté
  let browsing = null;     // { slug, name } — liste d'un autre, en lecture seule
  let favorites = new Set();
  let view = 'all';
  let syncError = false;

  // Arrondi au dollar : la précision au cent n'aide pas à décider, et c'est de
  // toute façon une conversion.
  const amountFormat = new Intl.NumberFormat('fr-CA', { maximumFractionDigits: 0 });
  const money = (value) => `${amountFormat.format(Math.round(value))} $`;

  // timeZone: 'UTC' — cadRateDate arrive en simple « AAAA-MM-JJ » : sans ça,
  // Date() l'interprète à minuit UTC et l'affichage local recule d'un jour.
  const dayFormat = new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const shortDate = (value) => {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '—' : dayFormat.format(date);
  };

  const escapeHtml = (value) =>
    String(value ?? '').replace(/[&<>"']/g, (char) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

  const normalize = (value) =>
    String(value ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const readJson = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  };

  function haystack(item) {
    if (!item._h) {
      item._h = normalize([item.name, item.num, item.setNum, item.code, item.theme, item.year,
        item.marstoyTitle].join(' '));
    }
    return item._h;
  }

  // Les sets sans prix LEGO connu n'ont pas d'économie : ils passent à la fin
  // des tris par économie plutôt que de s'intercaler comme des zéros.
  const byDesc = (field) => (a, b) => {
    const left = a[field];
    const right = b[field];
    if (left == null && right == null) return a.name.localeCompare(b.name);
    if (left == null) return 1;
    if (right == null) return -1;
    return right - left || a.name.localeCompare(b.name);
  };
  const byAsc = (field) => (a, b) => {
    const left = a[field];
    const right = b[field];
    if (left == null && right == null) return a.name.localeCompare(b.name);
    if (left == null) return 1;
    if (right == null) return -1;
    return left - right || a.name.localeCompare(b.name);
  };

  const comparators = {
    // Arrivée chez Marstoy, pas année de sortie du set. Expérimental : Marstoy
    // ne date pas ses ajouts, on reconstitue depuis un registre qui n'a encore
    // presque pas d'historique. L'année départage les ex æquo.
    added: (a, b) =>
      String(b.addedAt || '').localeCompare(String(a.addedAt || '')) ||
      (b.year ?? 0) - (a.year ?? 0) ||
      a.name.localeCompare(b.name),
    year: (a, b) => (b.year ?? 0) - (a.year ?? 0) || a.name.localeCompare(b.name),
    savingsPct: byDesc('savingsPct'),
    savingsAbs: byDesc('savingsCad'),
    priceAsc: byAsc('priceCad'),
    legoDesc: byDesc('legoPriceCad'),
    parts: byDesc('numParts'),
    name: (a, b) => a.name.localeCompare(b.name),
  };

  /* ---------------------------------------------------------------- favoris */

  const activeList = () => browsing || account;
  const canEdit = () => Boolean(account) && !browsing;

  function loadLocalFavorites(slug) {
    favorites = new Set(readJson(STORE_FAV(slug), []));
  }

  function saveLocalFavorites() {
    const list = activeList();
    if (list) localStorage.setItem(STORE_FAV(list.slug), JSON.stringify([...favorites]));
  }

  const snapshotOf = (item) => ({
    code: item.code, name: item.name, num: item.num, setNum: item.setNum,
    theme: item.theme, year: item.year, numParts: item.numParts, imgUrl: item.imgUrl,
    price: item.price, priceCad: item.priceCad, legoPriceCad: item.legoPriceCad,
    savingsCad: item.savingsCad, savingsPct: item.savingsPct,
  });

  // Rafraîchit, pour les codes donnés, le dernier état connu tant que le set
  // est encore dans le catalogue — c'est cette copie qui sert une fois qu'il
  // en sort.
  function refreshFavSnapshots(codes) {
    if (!codes.length) return;
    const snaps = readJson(STORE_FAV_SNAP, {});
    let changed = false;
    for (const code of codes) {
      const item = byCode.get(code);
      if (!item) continue;
      snaps[code] = snapshotOf(item);
      changed = true;
    }
    if (changed) localStorage.setItem(STORE_FAV_SNAP, JSON.stringify(snaps));
  }

  let syncTimer;
  function scheduleSync() {
    if (!api || !canEdit()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      try {
        const response = await fetch(`${api}/api/list/${account.slug}`, {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ codes: [...favorites] }),
        });
        if (!response.ok) throw new Error(String(response.status));
        syncError = false;
      } catch {
        // La liste reste en local : on retentera au prochain changement ou au
        // prochain chargement.
        syncError = true;
      }
      renderStatus();
    }, 700);
  }

  async function pullList(slug) {
    if (!api) return null;
    try {
      const response = await fetch(`${api}/api/list/${slug}`, { cache: 'no-store' });
      if (!response.ok) return null;
      return await response.json();
    } catch {
      return null;
    }
  }

  function toggleFavorite(code) {
    if (!canEdit()) {
      openSheet(browsing ? 'Reviens à ton compte pour modifier ta liste.' : null);
      return;
    }
    if (favorites.has(code)) favorites.delete(code);
    else { favorites.add(code); refreshFavSnapshots([code]); }
    saveLocalFavorites();
    scheduleSync();

    for (const button of grid.querySelectorAll(`[data-star="${code}"]`)) {
      button.setAttribute('aria-pressed', String(favorites.has(code)));
      button.textContent = favorites.has(code) ? '★' : '☆';
    }
    renderAccount();
    if (view === 'list') apply();
    else renderStatus();
  }

  /* ---------------------------------------------------------------- comptes */

  function renderAccount() {
    const label = browsing
      ? `👁 ${browsing.name}`
      : account
        ? `👤 ${account.name}`
        : '👤 Invité';
    accountEl.innerHTML = `<span>${escapeHtml(label)}</span>`;
    const listTab = document.getElementById('tab-list');
    const owner = activeList();
    listTab.textContent = owner
      ? `★ ${browsing ? browsing.name : 'Ma liste'} (${favorites.size})`
      : '★ Ma liste';
  }

  async function setAccount(user, { asBrowsing = false } = {}) {
    if (asBrowsing) {
      browsing = user;
    } else {
      browsing = null;
      account = user;
      if (user) localStorage.setItem(STORE_ACCOUNT, JSON.stringify(user));
      else localStorage.removeItem(STORE_ACCOUNT);
    }

    const owner = activeList();
    if (!owner) {
      favorites = new Set();
    } else {
      loadLocalFavorites(owner.slug);
      const remote = await pullList(owner.slug);
      if (remote) {
        // On fusionne au lieu d'écraser : une étoile ajoutée hors ligne sur cet
        // appareil ne doit pas disparaître au premier chargement.
        const merged = asBrowsing ? remote.codes : [...new Set([...favorites, ...remote.codes])];
        favorites = new Set(merged);
        saveLocalFavorites();
        if (!asBrowsing && merged.length !== remote.codes.length) scheduleSync();
      }
      refreshFavSnapshots([...favorites]);
    }
    renderAccount();
    apply();
  }

  async function fetchUsers() {
    if (!api) return [];
    try {
      const response = await fetch(`${api}/api/users`, { cache: 'no-store' });
      if (!response.ok) return [];
      return (await response.json()).users || [];
    } catch {
      return [];
    }
  }

  async function openSheet(hint) {
    const hintEl = document.getElementById('sheet-hint');
    const usersEl = document.getElementById('sheet-users');
    sheetEl.setAttribute('open', '');

    if (!api) {
      hintEl.textContent =
        "Le serveur des listes n'est pas configuré : tes favoris restent sur cet appareil.";
      usersEl.innerHTML = '';
      return;
    }

    hintEl.textContent = hint || 'Choisis ton compte. Il te suivra d’un appareil à l’autre.';
    usersEl.innerHTML = '<div class="user-row">Chargement…</div>';
    const users = await fetchUsers();

    usersEl.innerHTML = users.length
      ? users.map((user) => `
          <button type="button" class="user-row${account && account.slug === user.slug ? ' current' : ''}"
                  data-slug="${escapeHtml(user.slug)}" data-name="${escapeHtml(user.name)}">
            ${escapeHtml(user.name)}
            <span class="count">${user.count} favori${user.count > 1 ? 's' : ''}</span>
          </button>`).join('')
      : '<p>Aucun compte pour l’instant. Crées-en un.</p>';
  }

  const closeSheet = () => sheetEl.removeAttribute('open');

  sheetEl.addEventListener('click', async (event) => {
    if (event.target === sheetEl) return closeSheet();

    const row = event.target.closest('[data-slug]');
    if (!row) return;
    const user = { slug: row.dataset.slug, name: row.dataset.name };

    if (account && account.slug === user.slug) {
      closeSheet();
      return setAccount(user);
    }
    // La confirmation est tout ce qui empêche d'ajouter par mégarde dans la
    // liste de quelqu'un d'autre. Ce n'est pas une protection, c'est un garde-fou.
    const confirmed = window.confirm(
      `Te connecter comme ${user.name} ?\n\n` +
      `Tes ★ iront dans sa liste. Annule pour la consulter sans y toucher.`,
    );
    closeSheet();
    await setAccount(user, { asBrowsing: !confirmed });
  });

  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  accountEl.addEventListener('click', () => openSheet());

  document.getElementById('sheet-new').addEventListener('click', async () => {
    if (!api) return closeSheet();
    const name = window.prompt('Prénom pour ce compte :', '');
    if (!name || !name.trim()) return;
    try {
      const response = await fetch(`${api}/api/users`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: name.trim() }),
      });
      const data = await response.json();
      if (response.status === 409) {
        window.alert('Ce compte existe déjà — choisis-le dans la liste.');
        return openSheet();
      }
      if (!response.ok) throw new Error(data.error || String(response.status));
      closeSheet();
      await setAccount({ slug: data.slug, name: data.name });
    } catch (error) {
      window.alert(`Création impossible : ${error.message}`);
    }
  });

  /* ------------------------------------------------------------------ vues */

  /**
   * Les écartées n'ont pas d'onglet : quand on y est, aucun onglet n'est
   * sélectionné, et le lien « Retour au catalogue » de la ligne de statut est
   * la seule sortie.
   */
  function setView(next) {
    view = next;
    for (const tab of document.querySelectorAll('.tab')) {
      tab.setAttribute('aria-selected', String(tab.dataset.view === next));
    }
    apply();
  }

  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => setView(tab.dataset.view));
  }

  function renderTotals() {
    if (view !== 'list' || !filtered.length) {
      totalsEl.hidden = true;
      return;
    }
    const marstoy = filtered.reduce((sum, item) => sum + (item.priceCad || 0), 0);
    const lego = filtered.reduce((sum, item) => sum + (item.legoPriceCad || 0), 0);
    const saved = lego > 0 ? lego - marstoy : 0;

    totalsEl.hidden = false;
    totalsEl.innerHTML =
      `<div><b>${escapeHtml(money(marstoy))}</b>` +
      `<div class="sub">${filtered.length} set${filtered.length > 1 ? 's' : ''}` +
      `${lego > 0 ? ` · LEGO ${escapeHtml(money(lego))}` : ''}</div></div>` +
      (saved > 0 ? `<span class="save">${escapeHtml(money(saved))} off</span>` : '') +
      '<button type="button" id="export">Exporter</button>';

    document.getElementById('export').addEventListener('click', exportList);
  }

  // Colonnes séparées par des tabulations : collé dans un tableur, chaque
  // champ tombe dans sa colonne. Décimale en virgule et aucun séparateur de
  // milliers, sinon un tableur fr-CA lit « 1 234,56 » comme du texte.
  const EXPORT_HEADERS = [
    'Nom du set', 'prix marstoy', 'prix original',
    'economie (%)', 'economie ($)', 'Lien marstoy',
  ];
  const cell = (value) => (value == null ? '' : String(value).replaceAll('\t', ' '));
  const amount = (value) => (value == null ? '' : value.toFixed(2).replace('.', ','));

  function exportRows() {
    const rows = filtered.map((item) => [
      item.name,
      amount(item.priceCad ?? null),
      // Cellules vides plutôt que des zéros : un prix LEGO inconnu ne veut pas
      // dire une économie nulle, et un zéro fausserait les moyennes.
      amount(item.legoPriceCad ?? null),
      item.savingsPct ?? '',
      amount(item.savingsCad ?? null),
      // Un produit retiré du catalogue garde ses prix, mais son lien mène à un
      // 404 : la carte le masque déjà, l'export ne doit pas le ressusciter.
      item.unavailable ? '' : item.marstoyUrl,
    ]);

    const marstoy = filtered.reduce((sum, item) => sum + (item.priceCad || 0), 0);
    const lego = filtered.reduce((sum, item) => sum + (item.legoPriceCad || 0), 0);
    // L'économie totale ne porte que sur les sets dont les deux prix sont
    // connus : rapporter une somme partielle à une somme complète la gonflerait.
    const comparable = filtered.filter((item) => item.legoPriceCad && item.priceCad);
    const paid = comparable.reduce((sum, item) => sum + item.priceCad, 0);
    const retail = comparable.reduce((sum, item) => sum + item.legoPriceCad, 0);

    rows.push([
      'Total',
      amount(marstoy),
      lego > 0 ? amount(lego) : '',
      retail > 0 ? Math.round(((retail - paid) / retail) * 100) : '',
      retail > 0 ? amount(retail - paid) : '',
      '',
    ]);

    return [EXPORT_HEADERS, ...rows];
  }

  /**
   * L'API presse-papiers refuse dans plus de cas qu'on ne le croit : contexte
   * non sécurisé, onglet non focalisé sous Chrome, activation perdue sous
   * Safari. `execCommand` reste accepté dans une partie de ces cas, d'où les
   * deux tentatives. Rend `false` si les deux échouent — jamais d'échec muet.
   */
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // On tente la voie historique ci-dessous.
    }

    const area = document.createElement('textarea');
    area.value = text;
    // Lecture seule et hors écran : sinon iOS ouvre le clavier et fait défiler.
    area.readOnly = true;
    area.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.append(area);
    try {
      area.focus();
      area.setSelectionRange(0, text.length);
      return document.execCommand('copy');
    } catch {
      return false;
    } finally {
      area.remove();
    }
  }

  function showCopyFallback(text) {
    fallbackEl.querySelector('textarea').value = text;
    fallbackEl.hidden = false;
    const area = fallbackEl.querySelector('textarea');
    area.focus();
    area.setSelectionRange(0, text.length);
    area.scrollIntoView({ block: 'nearest' });
  }

  async function exportList() {
    const text = exportRows().map((row) => row.map(cell).join('\t')).join('\n');
    const plural = filtered.length > 1 ? 's' : '';
    fallbackEl.hidden = true;

    // Le presse-papiers d'abord : des colonnes servent à être collées quelque
    // part. La feuille de partage reste le repli quand il est refusé.
    if (await copyText(text)) {
      window.alert(`${filtered.length} set${plural} copié${plural} en colonnes.`
        + ' Colle dans un tableur.');
      return;
    }

    if (navigator.share) {
      try {
        const owner = activeList();
        await navigator.share({
          title: `Short list Marstoy${owner ? ` — ${owner.name}` : ''}`,
          text,
        });
        return;
      } catch (error) {
        // Annulation volontaire : l'utilisateur a eu ce qu'il voulait, on se
        // tait. Tout autre échec mérite le repli visible.
        if (error?.name === 'AbortError') return;
      }
    }

    showCopyFallback(text);
  }

  /**
   * Écrit la ligne de statut avec, au besoin, un lien vers les écartées.
   * Le texte passe par des nœuds texte plutôt que par `innerHTML` : il est bâti
   * à partir du catalogue, dont la devise vient d'une page Marstoy.
   */
  function setStatus(text, link) {
    const nodes = [document.createTextNode(text)];
    if (link) {
      const anchor = document.createElement('a');
      anchor.href = '#';
      anchor.textContent = link.label;
      anchor.addEventListener('click', (event) => {
        event.preventDefault();
        setView(link.view);
      });
      nodes.push(document.createTextNode(' · '), anchor);
    }
    statusEl.replaceChildren(...nodes);
  }

  function renderStatus() {
    const owner = activeList();
    if (view === 'skipped') {
      setStatus(
        `${filtered.length} référence${filtered.length > 1 ? 's' : ''} écartée`
        + `${filtered.length > 1 ? 's' : ''} — écart le plus faible en premier.`
        + ' Une fiche Marstoy erronée se corrige chez eux, pas ici.',
        { label: 'Retour au catalogue', view: 'all' },
      );
      return;
    }
    if (view === 'list') {
      setStatus(filtered.length
        ? (browsing ? `Liste de ${browsing.name} — lecture seule` : 'Ta short list')
          + (syncError ? ' · ⚠ non synchronisée' : '')
        : '');
      return;
    }
    const terms = normalize(queryEl.value).split(/\s+/).filter(Boolean);
    setStatus(
      `${filtered.length} set${filtered.length > 1 ? 's' : ''}` +
      (terms.length ? ` sur ${products.length}` : coverage) +
      priceNote +
      scanNote +
      (owner && syncError ? ' · ⚠ favoris non synchronisés' : ''),
      // Les écartées ne valent pas un onglet permanent : elles se signalent
      // d'un mot, là où on lit déjà la couverture du catalogue.
      skipped.length && !terms.length
        ? { label: `${skipped.length} écartée${skipped.length > 1 ? 's' : ''}`, view: 'skipped' }
        : null,
    );
  }

  function listPool() {
    const snaps = readJson(STORE_FAV_SNAP, {});
    return [...favorites]
      .map((code) => byCode.get(code) || (snaps[code] && { ...snaps[code], unavailable: true }))
      .filter(Boolean);
  }

  function apply() {
    const terms = normalize(queryEl.value).split(/\s+/).filter(Boolean);
    let pool = view === 'list' ? listPool() : view === 'skipped' ? skipped : products;
    if (terms.length) pool = pool.filter((item) => terms.every((term) => haystack(item).includes(term)));

    // Les écartées gardent leur ordre de tri propre : elles n'ont ni prix, ni
    // année, ni thème, donc aucun des tris du menu ne s'y applique.
    filtered = view === 'skipped'
      ? pool.slice()
      : pool.slice().sort(comparators[sortEl.value] || comparators.added);
    grid.replaceChildren();
    grid.classList.toggle('rows', view === 'skipped');
    rendered = 0;

    renderTotals();
    renderStatus();

    if (!filtered.length) {
      grid.innerHTML = view === 'list'
        ? `<div class="empty">${activeList()
            ? 'Aucun favori pour l’instant — touche l’étoile d’un set.'
            : 'Choisis un compte en haut à droite pour créer ta short list.'}</div>`
        : '<div class="empty">Aucun résultat.</div>';
      return;
    }
    renderMore();
  }

  function priceHtml(item) {
    if (item.priceCad == null) {
      return item.price != null
        ? `<span class="price">${escapeHtml(item.price)} ${escapeHtml(sourceCurrency)}</span>`
        : '';
    }
    const original = item.price != null ? `${item.price} ${sourceCurrency}` : '';
    const parts = [
      `<span class="price" title="Prix Marstoy : ${escapeHtml(original)} — converti">` +
        `${escapeHtml(money(item.priceCad))}</span>`,
    ];
    if (item.savingsCad > 0 && item.legoPriceCad) {
      parts.push(`<s class="was" title="Prix de détail LEGO">${escapeHtml(money(item.legoPriceCad))}</s>`);
      const pct = item.savingsPct != null ? `${item.savingsPct} %` : null;
      parts.push(`<span class="save">${[pct, money(item.savingsCad)].filter(Boolean).join(' · ')}</span>`);
    }
    return parts.join('');
  }

  function cardHtml(item) {
    // Le numéro de set reste cherchable, mais il n'a pas sa place sur la carte :
    // c'est le nom et l'image qui identifient le set.
    const facts = [
      item.year || null,
      item.numParts ? `${item.numParts} pièces` : null,
    ].filter(Boolean).join(' · ');
    const starred = favorites.has(item.code);
    const gone = Boolean(item.unavailable);

    return `
      <article class="card${gone ? ' unavailable' : ''}">
        <div class="thumb">
          ${item.imgUrl
            ? `<img src="${escapeHtml(item.imgUrl)}" alt="${escapeHtml(item.name)}" loading="lazy"
                    referrerpolicy="no-referrer">`
            : '<div class="fallback">pas d\'image</div>'}
          <button class="star" type="button" data-star="${escapeHtml(item.code)}"
                  aria-pressed="${starred}" aria-label="Ajouter à ma liste"
                  ${canEdit() ? '' : 'disabled'}>${starred ? '★' : '☆'}</button>
        </div>
        <div class="body">
          ${gone ? '<span class="gone">Retiré chez Marstoy</span>' : ''}
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="facts">${facts}</div>
          ${item.theme ? `<div class="theme">${escapeHtml(item.theme)}</div>` : ''}
          <div class="row">${priceHtml(item)}</div>
          <div class="links">
            ${!gone && item.marstoyUrl ? `<a href="${escapeHtml(item.marstoyUrl)}" target="_blank"
                                    rel="noopener">Commander</a>` : ''}
            <a href="https://www.lego.com/fr-ca/search?q=${escapeHtml(item.num)}"
               target="_blank" rel="noopener">LEGO</a>
          </div>
        </div>
      </article>`;
  }

  /**
   * Carte d'une référence écartée. Pas d'image ni de prix : le set LEGO n'est
   * justement pas confirmé. Ce qui compte est la preuve — les deux nombres de
   * pièces — et les deux liens pour trancher soi-même.
   */
  function skippedCardHtml(item) {
    const gap = item.gapPct != null ? ` · écart ${item.gapPct} %` : '';
    const proof = item.kind === 'rejected'
      ? `${item.marstoyParts} pièces annoncées contre ${item.legoParts} chez LEGO${gap}`
      : `aucun set LEGO pour ${item.tried?.length ? item.tried.join(', ') : 'les numéros essayés'}`;

    return `
      <article class="card skipped">
        <div class="body">
          <div class="name">${escapeHtml(item.code)}</div>
          ${item.name
            ? `<div class="facts">apparié à ${escapeHtml(item.num)} ${escapeHtml(item.name)}</div>`
            : ''}
          <div class="theme" title="${escapeHtml(item.marstoyTitle || '')}">${
            escapeHtml(item.marstoyTitle || 'sans titre chez Marstoy')}</div>
          <div class="facts">${escapeHtml(proof)}</div>
          <span class="gone">${escapeHtml(item.reason)}</span>
          <div class="links">
            ${item.url
              ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">Fiche Marstoy</a>`
              : ''}
            ${item.setUrl
              ? `<a href="${escapeHtml(item.setUrl)}" target="_blank" rel="noopener">Set supposé</a>`
              : ''}
          </div>
        </div>
      </article>`;
  }

  function renderMore() {
    const slice = filtered.slice(rendered, rendered + PAGE);
    if (!slice.length) return;
    const fragment = document.createElement('template');
    fragment.innerHTML = slice.map(view === 'skipped' ? skippedCardHtml : cardHtml).join('');
    grid.append(fragment.content);
    rendered += slice.length;
  }

  new IntersectionObserver((entries) => {
    if (entries.some((entry) => entry.isIntersecting)) renderMore();
  }, { rootMargin: '600px' }).observe(document.getElementById('sentinel'));

  grid.addEventListener('click', (event) => {
    const star = event.target.closest('[data-star]');
    if (star) toggleFavorite(star.dataset.star);
  });

  let timer;
  queryEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(apply, 120);
  });
  sortEl.addEventListener('change', apply);

  /* ------------------------------------------------------- reconstruction */

  const refreshEl = document.getElementById('refresh');
  const TOKEN_KEY = 'mr:ghToken';

  function askToken() {
    const token = window.prompt(
      'Un jeton GitHub est nécessaire pour lancer la reconstruction.\n\n' +
      'github.com/settings/personal-access-tokens/new\n' +
      '  · Only select repositories → ce dépôt\n' +
      '  · Repository permissions → Actions : Read and write\n\n' +
      'Il reste sur cet appareil.', '');
    if (token && token.trim()) {
      localStorage.setItem(TOKEN_KEY, token.trim());
      return token.trim();
    }
    return null;
  }

  async function waitForNewCatalog(previousDate) {
    const deadline = Date.now() + 10 * 60 * 1000;
    while (Date.now() < deadline) {
      await new Promise((resolve) => setTimeout(resolve, 20000));
      try {
        const response = await fetch(`./data/catalog.json?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const fresh = await response.json();
          if (fresh.generatedAt && fresh.generatedAt !== previousDate) return true;
        }
      } catch {
        // Réseau instable : on retentera au prochain tour.
      }
    }
    return false;
  }

  refreshEl.addEventListener('click', async () => {
    if (!repo || !repo.slug || !repo.ref) {
      window.alert('Reconstruction indisponible : le catalogue ne contient pas les informations du dépôt.');
      return;
    }
    const minutes = repo.approxMinutes || 4;
    if (!window.confirm(
      `Reconstruire le catalogue ?\n\n` +
      `Cela relance la collecte complète sur marstoy.com et prend environ ${minutes} minutes. ` +
      `La page se rechargera toute seule une fois terminé.`)) return;

    let token = localStorage.getItem(TOKEN_KEY) || askToken();
    if (!token) return;

    refreshEl.disabled = true;
    refreshEl.classList.add('spinning');
    const previousDate = (await (await fetch('./data/catalog.json', { cache: 'no-store' })).json())
      .generatedAt;

    try {
      const response = await fetch(
        `https://api.github.com/repos/${repo.slug}/actions/workflows/${repo.workflow}/dispatches`,
        {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ ref: repo.ref }),
        });

      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem(TOKEN_KEY);
        throw new Error('jeton refusé — il a été oublié, réessaie pour en saisir un autre');
      }
      if (!response.ok) throw new Error(`GitHub a répondu ${response.status}`);

      statusEl.textContent = `Reconstruction lancée — environ ${minutes} minutes…`;
      if (await waitForNewCatalog(previousDate)) window.location.reload();
      else statusEl.textContent = 'Toujours en cours — recharge la page dans quelques minutes.';
    } catch (error) {
      window.alert(`Reconstruction impossible : ${error.message}`);
      apply();
    } finally {
      refreshEl.disabled = false;
      refreshEl.classList.remove('spinning');
    }
  });

  /* ------------------------------------------------------------ démarrage */

  fetch('./data/catalog.json', { cache: 'no-cache' })
    .then((response) => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(async (catalog) => {
      products = catalog.products || [];
      byCode = new Map(products.map((item) => [item.code, item]));
      // Les écarts les plus faibles d'abord : ce sont les correspondances les
      // plus douteuses, donc celles qui valent un coup d'œil. M33406 était de
      // celles-là — 27 % d'écart sur une fiche Marstoy erronée, corrigée depuis.
      skipped = (catalog.skipped || []).slice().sort((a, b) =>
        (a.gapPct ?? Infinity) - (b.gapPct ?? Infinity) || a.code.localeCompare(b.code));
      repo = catalog.repo || null;
      // La barre oblique finale est facile à copier depuis le tableau de bord
      // Cloudflare : on la retire plutôt que de fabriquer des « //api/… ».
      api = ((catalog.api && catalog.api.favorites) || '').replace(/\/+$/, '') || null;

      const total = catalog.counts && catalog.counts.marstoyProducts;
      if (total && total > products.length) {
        coverage = ` clonant un set LEGO, sur ${total} produits Marstoy`;
      }

      const currency = catalog.currency || {};
      if (currency.source) sourceCurrency = currency.source;
      if (currency.cadRate) {
        // Les montants des cartes portent « $ » sans devise : elle est nommée
        // ici, une fois.
        priceNote = ` · CAD au ${shortDate(currency.cadRateDate)}${currency.assumed ? ' (approx.)' : ''}`;
      }

      if (catalog.generatedAt) scanNote = ` · maj le ${shortDate(catalog.generatedAt)}`;

      if (!products.length) {
        statusEl.textContent = 'Catalogue vide — lance le workflow depuis l’onglet Actions.';
        return;
      }

      const saved = readJson(STORE_ACCOUNT, null);
      if (saved && saved.slug) await setAccount(saved);
      else {
        renderAccount();
        apply();
      }
    })
    .catch((error) => {
      statusEl.textContent = `Catalogue introuvable (${error.message}).`;
    });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
